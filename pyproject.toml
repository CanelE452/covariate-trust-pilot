[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covariate-trust-pilot"
version = "0.1.0"
description = "Controlled numerical study of forecasted future covariates in zero-shot Chronos-2"
requires-python = ">=3.10"
dependencies = [
    "chronos-forecasting==2.3.1",
    "pandas[pyarrow]>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "matplotlib>=3.8,<4",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "psutil>=5.9,<7",
    # Pin required because transformers (installed in the host environment)
    # requires huggingface-hub<1.0; without this pin `import chronos` fails.
    "huggingface-hub>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: requires a working Chronos-2 install (model download / GPU)",
]
